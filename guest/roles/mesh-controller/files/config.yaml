server_url: https://mesh.agentos.internal:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/db/agentos-secrets/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
    region_id: 999
    region_code: agentos
    region_name: agentOS private DERP
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/db/agentos-secrets/headscale/derp_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 0.0.0.0
    ipv6: "::"
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 24h

database:
  type: sqlite
  sqlite:
    path: /var/db/headscale/db.sqlite
    write_ahead_log: true

tls_cert_path: /var/db/agentos-secrets/headscale/tls.crt
tls_key_path: /var/db/agentos-secrets/headscale/tls.key

log:
  format: json
  level: info

policy:
  mode: file
  path: /usr/local/etc/headscale/policy.hujson

dns:
  magic_dns: true
  base_domain: agent.mesh
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 2606:4700:4700::1111
  search_domains:
    - agent.mesh
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
