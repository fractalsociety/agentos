[package]
name = "fractalos-vibe-engine"
version = "0.1.3"
edition = "2021"
description = "Vibe Engine - service hot-swap protocol for FractalOS vibe-coding"

[features]
std = ["fractalos-sim", "tracing"]

[dependencies]
fractalos-sdk = { path = "../../sdk" }
fractalos-sim = { path = "../../sim", optional = true }
tracing     = { version = "0.1", optional = true }
