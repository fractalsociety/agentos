[package]
name = "fractalos-codex-harness"
version = "0.1.3"
edition = "2021"
description = "Capability-native Codex-style planning and execution loop for FractalOS"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = ["serde/std", "serde_json/std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
