[package]
name = "fractalos-mesh-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Headscale/Tailscale Noise join + DERP client that emits OP_WG_APPLY_NETMAP blobs"

[[bin]]
name = "fractalos-mesh-control"
path = "src/main.rs"

[features]
default = []
# Lab-only: allow http:// control key fetch (still requires trusted TLS for Noise upgrade).
insecure-keyfetch = ["ts_control/insecure-keyfetch"]

[dependencies]
anyhow = { workspace = true }
bytes = "1"
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
http-body-util = "0.1"
rustls = "0.23"
rustls-pemfile = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts_capabilityversion = "0.5"
ts_control = "0.5"
ts_control_noise = "0.5"
ts_derp = "0.5"
ts_http_util = "0.5"
ts_keys = { version = "0.5", features = ["serde"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
