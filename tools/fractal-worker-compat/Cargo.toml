[package]
name = "fractal-worker-compat"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Fractal compatibility worker protocol helpers and contract tests"
publish = false

[dependencies]
fractal-mesh-gateway = { path = "../fractal-mesh-gateway" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
regex = "1"

[[bin]]
name = "fractal-cursor-worker"
path = "src/bin/fractal_cursor_worker.rs"

[[bin]]
name = "fractal-claude-worker"
path = "src/bin/fractal_claude_worker.rs"

[[bin]]
name = "fractal-hermes-worker"
path = "src/bin/fractal_hermes_worker.rs"

[[bin]]
name = "fractal-codex-worker"
path = "src/bin/fractal_codex_worker.rs"

[[test]]
name = "test_cursor_worker"
path = "../../tests/compat/test_cursor_worker.rs"

[[test]]
name = "test_claude_worker"
path = "../../tests/compat/test_claude_worker.rs"

[[test]]
name = "test_hermes_worker"
path = "../../tests/compat/test_hermes_worker.rs"

[[test]]
name = "test_codex_worker"
path = "../../tests/compat/test_codex_worker.rs"

[[test]]
name = "test_remote_worker_sessions"
path = "../../tests/integration/test_remote_worker_sessions.rs"
