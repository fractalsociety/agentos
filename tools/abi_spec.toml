# agentOS per-PD ABI spec — machine-readable source of truth.
#
# This file is the authoritative registry of IPC opcodes and channel IDs,
# grouped per protection domain (PD). `tools/gen-abi` consumes it and emits
# kernel/agentos-root-task/include/agentos_abi.h.
#
# The generator HARD-FAILS the build (nonzero exit) on:
#   - a duplicate opcode value within a single PD's opcode table
#   - a duplicate channel id within a single PD's channel scope
#   - a `contract = "<dir>"` reference whose contracts/<dir>/ directory is
#     missing (missing contract coverage)
#   - a constant whose `legacy` name and value drift from agentos.h (caught at
#     C-compile time via the _Static_assert block this header emits)
#
# After editing, regenerate with:
#   cargo run -p gen-abi -- tools/abi_spec.toml \
#       -o kernel/agentos-root-task/include/agentos_abi.h
# (or `cargo xtask gen-abi`, which writes the same path).
#
# `legacy` is the existing #define / enum name in agentos.h that this entry
# mirrors; the generated header emits a _Static_assert tying the two together
# so a stale agentos.h constant fails the build.

version = "1"

# ── EventBus PD ───────────────────────────────────────────────────────── #
[[pd]]
name = "event_bus"
contract = "event-bus"
trace_pd = 1

  [[pd.opcode]]
  name = "INIT"
  value = 0x0001
  legacy = "MSG_EVENTBUS_INIT"
  [[pd.opcode]]
  name = "SUBSCRIBE"
  value = 0x0002
  legacy = "MSG_EVENTBUS_SUBSCRIBE"
  [[pd.opcode]]
  name = "UNSUBSCRIBE"
  value = 0x0003
  legacy = "MSG_EVENTBUS_UNSUBSCRIBE"
  [[pd.opcode]]
  name = "STATUS"
  value = 0x0004
  legacy = "MSG_EVENTBUS_STATUS"
  [[pd.opcode]]
  name = "PUBLISH_BATCH"
  value = 0x0005
  legacy = "MSG_EVENTBUS_PUBLISH_BATCH"
  [[pd.opcode]]
  name = "QUERY_SUBSCRIBERS"
  value = 0x2701
  legacy = "MSG_EVENTBUS_QUERY_SUBSCRIBERS"

  [[pd.channel]]
